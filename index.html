        let currentTab = 'tools';
        let currentCategory = 'ALL';
        let searchQuery = '';

        function getBadgeClass(pricing) {
            if (pricing.includes('100% Free')) return 'badge-free';
            if (pricing.includes('Daily Free')) return 'badge-daily';
            if (pricing.includes('Freemium')) return 'badge-freemium';
            return 'badge-paid';
        }

        function switchMainTab(tab) {
            currentTab = tab;
            document.getElementById('tabTools').classList.toggle('active', tab === 'tools');
            document.getElementById('tabLectures').classList.toggle('active', tab === 'lectures');
            document.getElementById('categoryChips').style.display = tab === 'tools' ? 'flex' : 'none';
            renderCards();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', c.innerText.includes(cat) || (cat==='ALL' && c.innerText==='All Tools'));
            });
            renderCards();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderCards();
        });

        function renderCards() {
            const listContainer = document.getElementById('cardsList');
            listContainer.innerHTML = '';

            if (currentTab === 'tools') {
                const filtered = db.tools.filter(t => {
                    const matchCat = (currentCategory === 'ALL' || t.sector === currentCategory);
                    const matchSearch = t.name.toLowerCase().includes(searchQuery) ||
                                        t.features.toLowerCase().includes(searchQuery) ||
                                        t.sub_category.toLowerCase().includes(searchQuery) ||
                                        t.sector.toLowerCase().includes(searchQuery);
                    return matchCat && matchSearch;
                });

                document.getElementById('itemCount').innerText = `Showing ${filtered.length} AI Platforms`;

                filtered.forEach(t => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="card-title">#${t.id} ${t.name}</div>
                                <div class="card-sub">${t.sector} • ${t.sub_category}</div>
                            </div>
                            <span class="badge ${getBadgeClass(t.pricing)}">${t.pricing.split('/')[0].trim()}</span>
                        </div>
                        <div class="card-desc">${t.features}</div>
                        <div class="card-specs">
                            <span>🎁 <strong>Free:</strong> ${t.free_tier}</span>
                            <span>💰 <strong>Paid:</strong> ${t.cost_plan}</span>
                            <span>⚡ ${t.deployment}</span>
                        </div>
                        <div class="card-actions">
                            ${t.home_url ? `<a href="${t.home_url}" target="_blank" class="btn btn-primary">🌐 Open Tool</a>` : ''}
                            ${t.tutorial_url ? `<a href="${t.tutorial_url}" target="_blank" class="btn btn-secondary">▶️ Tutorial</a>` : ''}
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            } else {
                const filtered = db.lectures.filter(l => {
                    return l.title.toLowerCase().includes(searchQuery) ||
                           l.instructor.toLowerCase().includes(searchQuery) ||
                           l.concepts.toLowerCase().includes(searchQuery) ||
                           l.domain.toLowerCase().includes(searchQuery);
                });

                document.getElementById('itemCount').innerText = `Showing ${filtered.length} University Courses & Masterclasses`;

                filtered.forEach(l => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="card-title">#${l.id} ${l.title}</div>
                                <div class="card-sub">${l.instructor} • ${l.platform}</div>
                            </div>
                            <span class="badge badge-free">FREE VIDEO</span>
                        </div>
                        <div class="card-desc">${l.concepts}</div>
                        <div class="card-specs">
                            <span>⏱️ <strong>Duration:</strong> ${l.duration}</span>
                            <span>🎯 <strong>Audience:</strong> ${l.audience}</span>
                            <span>📊 <strong>Level:</strong> ${l.difficulty}</span>
                        </div>
                        <div class="card-actions">
                            ${l.course_url ? `<a href="${l.course_url}" target="_blank" class="btn btn-primary">📖 Course Site</a>` : ''}
                            ${l.video_url ? `<a href="${l.video_url}" target="_blank" class="btn btn-secondary">▶️ Watch Video</a>` : ''}
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
        }

        // Initial render
        renderCards();
    </script>
